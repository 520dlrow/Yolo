/* ============================================================

}

/* ============================================================
RESET
============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
font-family:var(--font-sans);
background:var(--bg);color:var(--text);
font-size:13.5px;line-height:1.5;
-webkit-font-smoothing:antialiased;
display:flex;flex-direction:column;
transition:background-color .25s ease,color .25s ease;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;font-family:inherit}
svg{display:block;max-width:100%}
.hidden{display:none!important}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ============================================================
PRELOADER
============================================================ */
#mc88-pre{position:fixed;inset:0;z-index:99999;background:#000;display:grid;place-items:center;overflow:hidden}
#mc88-pre.done{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s ease}
.mc88-mark{
position:relative;font-family:var(--font-sans);
font-weight:900;font-size:clamp(3rem,16vw,9rem);
letter-spacing:-.05em;line-height:1;color:#fff;user-select:none;white-space:nowrap;
animation:mc88-main 5s steps(1) both;
}
.mc88-mark .n{color:#ccff00}
.mc88-mark::before,.mc88-mark::after{
content:attr(data-t);position:absolute;inset:0;
pointer-events:none;will-change:transform,opacity,clip-path;
}
.mc88-mark::before{color:#ff003c;mix-blend-mode:screen;animation:mc88-red 5s steps(1) both}
.mc88-mark::after{color:#00fff0;mix-blend-mode:screen;animation:mc88-cyan 5s steps(1) both}
.mc88-invert{position:absolute;inset:0;background:#fff;mix-blend-mode:difference;opacity:0;pointer-events:none;animation:mc88-invert 5s steps(1) both}

/* ============================================================
TOPBAR
============================================================ */
.topbar{
min-height:calc(56px + env(safe-area-inset-top,0px));
padding:env(safe-area-inset-top,0px) 12px 0;
display:flex;align-items:center;gap:10px;
background:var(--bg-1);
border-bottom:1px solid var(--border);
flex-shrink:0;z-index:20;
transition:background-color .25s ease,border-color .25s ease;
}
.brand{
display:flex;align-items:baseline;gap:1px;
font-family:var(--font-sans);font-weight:700;
font-size:14.5px;letter-spacing:-.02em;
color:var(--text);flex-shrink:0;user-select:none;
}
.brand span{color:var(--accent);font-weight:600;font-size:11px;margin-left:1px}
.topbar-center{flex:1;display:flex;justify-content:center;align-items:center;min-width:0}
.viewport{display:inline-flex;padding:3px;gap:1px;background:var(--bg-2);border:1px solid var(--border);border-radius:9px}
.vp-btn{
display:inline-flex;align-items:center;justify-content:center;gap:6px;
min-height:44px;padding:5px 11px;border-radius:6px;
font-size:11.5px;font-weight:500;color:var(--text-2);
transition:all .15s ease;white-space:nowrap;
}
.vp-btn:hover{color:var(--text)}
.vp-btn.on{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15),0 0 0 1px var(--border)}
.vp-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top-actions{display:flex;gap:2px;flex-shrink:0}
.icon-btn{
width:44px;height:44px;border-radius:7px;
display:grid;place-items:center;color:var(--text-2);
transition:all .15s ease;
}
.icon-btn:hover{background:var(--bg-2);color:var(--text)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
FILE TABS
============================================================ */
.tabs-bar{
height:48px;flex-shrink:0;
display:flex;align-items:stretch;
background:var(--bg-1);
border-bottom:1px solid var(--border);
min-width:0;
}
.tabs-scroll{flex:1;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab{
display:inline-flex;align-items:center;gap:8px;
padding:0 8px 0 12px;min-width:0;max-width:180px;
min-height:48px;
font-size:12px;font-weight:500;color:var(--text-2);
border-right:1px solid var(--border);
cursor:pointer;user-select:none;
transition:all .15s ease;position:relative;flex-shrink:0;
}
.tab:hover{background:var(--bg-2);color:var(--text)}
.tab.on{background:var(--bg);color:var(--text)}
.tab.on::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.tab-icon{
width:15px;height:15px;flex-shrink:0;
display:grid;place-items:center;
font-family:var(--font-mono);
font-size:8.5px;font-weight:700;
border-radius:3px;letter-spacing:-.02em;color:#fff;
}
.tab-icon[data-ext="html"],.tab-icon[data-ext="htm"]{background:#e34c26}
.tab-icon[data-ext="css"]{background:#264de4}
.tab-icon[data-ext="js"],.tab-icon[data-ext="mjs"]{background:#f7df1e;color:#000}
.tab-icon[data-ext="json"]{background:#292929}
.tab-icon[data-ext="md"],.tab-icon[data-ext="markdown"]{background:#6a737d}
.tab-icon[data-ext="txt"]{background:#6a737d}
.tab-icon[data-ext="svg"]{background:#ffb13b;color:#000}
.tab-icon[data-ext="xml"]{background:#8b6f47}
.tab-icon[data-ext="webmanifest"]{background:#5a8a4a}
.tab-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-close{
width:26px;height:26px;flex-shrink:0;
display:grid;place-items:center;border-radius:4px;
color:var(--text-3);opacity:0;
transition:all .15s ease;font-size:17px;line-height:1;margin-left:2px;
}
.tab:hover .tab-close,.tab.on .tab-close{opacity:1}
.tab-close:hover{background:var(--bg-3);color:var(--danger)}
.tab-add{
width:48px;flex-shrink:0;
display:grid;place-items:center;color:var(--text-2);
border-left:1px solid var(--border);
transition:all .15s ease;
}
.tab-add:hover{color:var(--accent);background:var(--bg-2)}
.tab-add:active{transform:scale(.95)}
.tab-add svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ============================================================
MOBILE SWITCH
============================================================ */
.mv-switch{
display:none;
background:var(--bg-1);
border-bottom:1px solid var(--border);
padding:6px;
gap:4px;
flex-shrink:0;
}
.mv-btn{
flex:1;
display:inline-flex;align-items:center;justify-content:center;
min-height:44px;gap:8px;padding:9px 12px;border-radius:8px;
font-size:13px;font-weight:500;color:var(--text-2);
transition:all .15s ease;
}
.mv-btn:hover{color:var(--text);background:var(--bg-2)}
.mv-btn.on{background:var(--bg-2);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.mv-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
WORKSPACE
============================================================ */
.workspace{
flex:1;display:flex;min-height:0;overflow:hidden;
}

.pane{
display:flex;flex-direction:column;
min-height:0;min-width:0;overflow:hidden;
}
.pane-editor{
width:50%;background:var(--bg-code);
border-right:1px solid var(--border);
}
.pane-preview{flex:1;min-width:0;background:var(--bg)}

.pane-head{
height:36px;flex-shrink:0;
display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:0 14px;
background:var(--bg-1);
border-bottom:1px solid var(--border);
font-family:var(--font-mono);
font-size:11px;color:var(--text-2);letter-spacing:.02em;
}
.pane-head .left,.pane-head .right{
display:inline-flex;align-items:center;gap:8px;min-width:0;
}
.pane-head .name{
color:var(--text);font-weight:500;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.pane-head .dot{
width:6px;height:6px;border-radius:50%;
background:var(--text-3);flex-shrink:0;transition:all .3s ease;
}
.pane-head.saved .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.pane-head.saving .dot{background:var(--warn)}
.pane-head .meta{color:var(--text-3);font-size:10px;letter-spacing:.04em;flex-shrink:0}

/* ============================================================
EDITOR
============================================================ */
.editor-wrap{flex:1;min-height:0;position:relative;display:flex}
.editor-wrap textarea{
flex:1;width:100%;height:100%;
padding:16px 18px;
background:var(--bg-code);color:var(--text);
border:0;outline:0;resize:none;
font-family:var(--font-mono);
font-size:16px;line-height:1.7;tab-size:2;
caret-color:var(--accent);
direction:ltr;text-align:left;-webkit-appearance:none;
}
.editor-wrap textarea::placeholder{color:var(--text-3)}
.editor-wrap textarea::selection{background:var(--accent);color:var(--accent-ink)}
.editor-wrap textarea::-webkit-scrollbar{width:10px;height:10px}
.editor-wrap textarea::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px}
.editor-wrap textarea::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

.editor-tools{
min-height:56px;flex-shrink:0;
display:flex;align-items:center;gap:2px;
padding:0 8px;
background:var(--bg-1);
border-top:1px solid var(--border);
overflow-x:auto;scrollbar-width:none;
}
.editor-tools::-webkit-scrollbar{display:none}
.tool-btn{
display:inline-flex;align-items:center;justify-content:center;gap:6px;
min-height:44px;padding:6px 10px;border-radius:6px;
font-size:11.5px;font-weight:500;color:var(--text-2);

overflow:auto;

linear-gradient(to right,var(--border) 1px,transparent 1px),
linear-gradient(to bottom,var(--border) 1px,transparent 1px);

}

.frame{
background:#fff;
border-radius:8px;
overflow:hidden;
box-shadow:
0 1px 2px rgba(0,0,0,.15),
0 20px 40px -20px rgba(0,0,0,.4),
0 0 0 1px var(--border-2);
flex-shrink:0;position:relative;
transition:width .25s cubic-bezier(.2,.8,.2,1),
height .25s cubic-bezier(.2,.8,.2,1),
border-radius .25s ease;
}
.frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}

.stage[data-v="phone"] .frame{
width: min(390px, 100%);
height: auto;
aspect-ratio: 390 / 844;
max-height: 100%;
}
.stage[data-v="desktop"] .frame{
width: 100%;
height: 100%;

.empty{

============================================================ */

/* ============================================================

@media (prefers-reduced-motion:reduce){

(function(){
'use strict';
const $  = (s,r=document) = r.querySelector(s);
const $$ = (s,r=document) = Array.from(r.querySelectorAll(s));

/* STORAGE HELPERS */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

/* NOTIFY BRIDGE */
function notify(title, body){
  if (window.AndroidBridge && typeof window.AndroidBridge.notify === 'function'){
    try { window.AndroidBridge.notify(String(title), String(body)); return; } catch(e){}
  }
  if ('Notification' in window){
    if (Notification.permission === 'granted'){
      try { new Notification(title, { body: body }); return; } catch(e){}
    } else if (Notification.permission === 'default'){
      Notification.requestPermission().then(function(p){
        if (p === 'granted') { try { new Notification(title, { body: body }); } catch(e){} }
      }).catch(function(){});
    }
  }
  if (typeof toast === 'function') toast(title);
}

/* COPY BRIDGE */
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); } catch(_){}
    document.body.removeChild(ta);
    return true;
  }
}

/* PRELOADER */
(function(){
  const pre = $('#mc88-pre');
  if (!pre) return;
  let skip = lsGet('v88.skipPre') === '1';
  if (skip){ pre.remove(); return; }
  const prev = document.body.style.overflow;
  document.body.style.overflow = 'hidden';
  setTimeout(() = {
    pre.classList.add('done');
    document.body.style.overflow = prev;
    setTimeout(() = pre.remove(), 500);
  }, 5000);
})();

/* TOAST */
let toastTimer;
function toast(msg, isErr){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  void t.offsetWidth;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() = t.classList.remove('on'), 2000);
  if (window.AndroidBridge && typeof window.AndroidBridge.toast === 'function'){
    try { window.AndroidBridge.toast(String(msg)); } catch(e){}
  }
}

/* THEMES */
const THEMES = [
  { id:'night', name:'Night', desc:'neutral dark', colors:['#0a0a0a','#141414','#d4ff3d'] },
  { id:'ink',   name:'Ink',   desc:'pure black',   colors:['#000000','#101010','#ffffff'] },
  { id:'warm',  name:'Warm',  desc:'amber on brown',colors:['#0e0c09','#18140f','#ffb84a'] },
  { id:'paper', name:'Paper', desc:'light · high contrast', colors:['#f7f7f5','#ffffff','#1a1a1a'] }
];
const THEME_BG = { night:'#0a0a0a', ink:'#000000', warm:'#0e0c09', paper:'#f7f7f5' };

function renderThemes(){
  const cur = document.documentElement.dataset.theme;
  $('#themes').innerHTML = THEMES.map(t = `
    <div class="theme-row${cur===t.id?' on':''}" data-theme="${t.id}"
      <span class="theme-swatch"${t.colors.map(c=`<span style="background:${c}"</span`).join('')}</span
      <div class="theme-info"
        <div class="theme-name"${t.name}</div
        <div class="theme-desc"${t.desc}</div
      </div
      <span class="theme-check"<svg viewBox="0 0 24 24"<polyline points="20 6 9 17 4 12"/</svg</span
    </div`).join('');
  $$('#themes .theme-row').forEach(r = r.addEventListener('click', () = applyTheme(r.dataset.theme)));
}
function applyTheme(id){
  document.documentElement.dataset.theme = id;
  $('#themeColor').setAttribute('content', THEME_BG[id] || '#0a0a0a');
  lsSet('v88.theme', id);
  renderThemes();
}
(function(){
  const s = lsGet('v88.theme');
  if (s && THEMES.some(t = t.id === s)) applyTheme(s); else renderThemes();
})();

/* DRAWER */
const drawer = $('#drawer'), scrim = $('#scrim');
function openDrawer(){ drawer.classList.add('on'); scrim.classList.add('on'); }
function closeDrawer(){ drawer.classList.remove('on'); scrim.classList.remove('on'); }
$('#settingsBtn').addEventListener('click', openDrawer);
$('#drawerClose').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);

/* PREFERENCES */
function setToggle(el, on){ el.classList.toggle('on', on); }
setToggle($('#tgAutosave'),  lsGet('v88.autosave') !== '0');
setToggle($('#tgPreloader'), lsGet('v88.skipPre') === '1');
setToggle($('#tgGrid'),      lsGet('v88.grid') !== '0');
if (lsGet('v88.grid') === '0') $('#stage').classList.add('no-grid');

$$('.trow').forEach(row = {
  row.addEventListener('click', () = {
    const key = row.dataset.toggle;
    if (key === 'autosave'){
      const on = !$('#tgAutosave').classList.contains('on');
      setToggle($('#tgAutosave'), on);
      lsSet('v88.autosave', on?'1':'0');
    } else if (key === 'preloader'){
      const on = !$('#tgPreloader').classList.contains('on');
      setToggle($('#tgPreloader'), on);
      lsSet('v88.skipPre', on?'1':'0');
    } else if (key === 'grid'){
      const on = !$('#tgGrid').classList.contains('on');
      setToggle($('#tgGrid'), on);
      lsSet('v88.grid', on?'1':'0');
      $('#stage').classList.toggle('no-grid', !on);
    }
  });
});

/* MULTI-FILE STATE */

<html lang="en"
<head
  <meta charset="utf-8"
  <meta name="viewport" content="width=device-width,initial-scale=1"

</head

    <pEdit the code and the preview updates live.</p
    <button id="tap"Tap me</button
  </div
  <script src="app.js"<\/script
</body
</html` },
  'style.css': { content: `*{box-sizing:border-box;margin:0;padding:0}

const state = { files:{}, active:null, viewport:'phone' };

function loadFromStorage(){
  try {
    const j = lsGet('v88.files');
    if (j){
      const parsed = JSON.parse(j);
      if (parsed && typeof parsed === 'object' && Object.keys(parsed).length){
        state.files = parsed;
      }
    }
    const a = lsGet('v88.activeFile'); if (a) state.active = a;
    const vp = lsGet('v88.viewport');
    if (vp === 'phone' || vp === 'desktop') state.viewport = vp;
  } catch(e){}
}
function saveToStorage(){
  try {
    lsSet('v88.files', JSON.stringify(state.files));
    lsSet('v88.activeFile', state.active || '');
    lsSet('v88.viewport', state.viewport);
  } catch(e){}
}

function init(){
  loadFromStorage();
  if (!Object.keys(state.files).length){
    state.files = JSON.parse(JSON.stringify(DEFAULT_FILES));
    state.active = 'index.html';
  }
  if (!state.active || !state.files[state.active]){
    state.active = Object.keys(state.files).find(k = /\.html?$/i.test(k)) || Object.keys(state.files)[0];
  }
  renderTabs();
  loadActive();
  setViewport(state.viewport);
  renderPreview();
  saveToStorage();
}

function extOf(name){ const i = name.lastIndexOf('.'); return i<0?'':name.slice(i+1).toLowerCase(); }
function iconLabel(ext){
  return ({html:'H',htm:'H',css:'C',js:'JS',mjs:'JS',json:'{}',md:'M',markdown:'M',txt:'T',svg:'S',xml:'X',webmanifest:'W'})[ext] || '·';
}
function escapeHtml(s){return String(s).replace(/[&<"']/g,c=({'&':'&amp;','<':'&lt;','':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderTabs(){
  const wrap = $('#tabsScroll');
  wrap.innerHTML = Object.keys(state.files).map(name = {
    const ext = extOf(name);
    const on = name === state.active;
    return `<div class="tab${on?' on':''}" data-file="${escapeHtml(name)}"
      <span class="tab-icon" data-ext="${escapeHtml(ext)}"${escapeHtml(iconLabel(ext))}</span
      <span class="tab-name"${escapeHtml(name)}</span
      <span class="tab-close" data-close="${escapeHtml(name)}" title="Close"×</span
    </div`;
  }).join('');
  $$('#tabsScroll .tab').forEach(tab = {
    const file = tab.dataset.file;
    tab.addEventListener('click', e = { if (e.target.closest('.tab-close')) return; switchFile(file); });
    tab.addEventListener('dblclick', e = { if (e.target.closest('.tab-close')) return; renameFile(file); });
  });
  $$('#tabsScroll .tab-close').forEach(btn = {
    btn.addEventListener('click', e = { e.stopPropagation(); deleteFile(btn.dataset.close); });
  });
  const active = wrap.querySelector('.tab.on');
  if (active) active.scrollIntoView({ block:'nearest', inline:'nearest' });
}

function switchFile(name){
  if (name === state.active) return;
  if (!state.files[name]) return;
  saveCurrentFile();
  state.active = name;
  loadActive();
  renderTabs();
  renderPreview();
  saveToStorage();
}

function loadActive(){
  const file = state.files[state.active];
  if (!file) return;
  $('#code').value = file.content || '';
  $('#editorName').textContent = state.active;
  $('#footFile').textContent = state.active;
  updateMeta();
  setStatus('saved');
  $('#code').scrollTop = 0;
}

function saveCurrentFile(){
  if (!state.active || !state.files[state.active]) return;
  state.files[state.active].content = $('#code').value;
}

function addFile(){
  const name = prompt('New file name:', 'new.html');
  if (!name) return;
  const clean = name.trim().replace(/^\/+/, '');
  if (!clean || !/^[\w\-.]+$/.test(clean)){
    toast('invalid file name', true);
    return;
  }
  if (state.files[clean]){ toast('file already exists', true); return; }
  saveCurrentFile();
  state.files[clean] = { content: '' };
  state.active = clean;
  renderTabs();
  loadActive();
  renderPreview();
  saveToStorage();
  toast('created · ' + clean);
}

function deleteFile(name){
  if (!state.files[name]) return;
  if (Object.keys(state.files).length === 1){ toast('cannot delete last file', true); return; }
  if (!confirm('Delete "' + name + '"?')) return;
  delete state.files[name];
  if (state.active === name){
    state.active = Object.keys(state.files)[0];
    loadActive();
  }
  renderTabs();
  renderPreview();
  saveToStorage();
  toast('deleted · ' + name);
}

function renameFile(name){
  if (!state.files[name]) return;
  const next = prompt('Rename to:', name);
  if (!next) return;
  const clean = next.trim();
  if (!clean || clean === name) return;
  if (state.files[clean]){ toast('name already used', true); return; }
  const ordered = {};
  for (const k of Object.keys(state.files)){
    if (k === name) ordered[clean] = state.files[name];
    else ordered[k] = state.files[k];
  }
  state.files = ordered;
  if (state.active === name) state.active = clean;
  renderTabs();
  loadActive();
  renderPreview();
  saveToStorage();
  toast('renamed to ' + clean);
}

/* EDITOR */
const code = $('#code');
const editorHead = $('#editorHead');
const editorMeta = $('#editorMeta');
const toolsStats = $('#toolsStats');

let saveTimer;
function setStatus(s){
  editorHead.classList.remove('saved','saving');
  if (s === 'saved') editorHead.classList.add('saved');
  else if (s === 'saving') editorHead.classList.add('saving');
}
function updateMeta(){
  const n = code.value.length;
  const label = n.toLocaleString('en-US') + ' chars';
  editorMeta.textContent = label;
  toolsStats.textContent = label;
}

code.addEventListener('input', () = {
  saveCurrentFile();
  updateMeta();
  setStatus('saving');
  renderPreview();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() = {
    try {
      const auto = lsGet('v88.autosave') !== '0';
      if (auto) saveToStorage();
    } catch(e){}
    setStatus('saved');
  }, 400);
});

code.addEventListener('keydown', e = {
  if (e.key === 'Tab'){
    e.preventDefault();
    const s = code.selectionStart, t = code.selectionEnd;
    code.value = code.value.slice(0,s) + '  ' + code.value.slice(t);
    code.selectionStart = code.selectionEnd = s + 2;
    updateMeta();
    saveCurrentFile();
    renderPreview();
  }
});

/* VIEWPORT */
const stage = $('#stage');
const dims = $('#dims');

function setViewport(v){
  if (v !== 'phone' && v !== 'desktop') v = 'phone';
  state.viewport = v;
  stage.dataset.v = v;
  dims.textContent = v === 'phone' ? '390 × 844' : 'fluid';
  $$('.vp-btn').forEach(b = b.classList.toggle('on', b.dataset.v === v));
  saveToStorage();
}
$$('.vp-btn').forEach(b = b.addEventListener('click', () = setViewport(b.dataset.v)));

/* MOBILE SWITCH */
$$('.mv-btn').forEach(b = {
  b.addEventListener('click', () = {
    const v = b.dataset.mv;
    $('#workspace').dataset.mv = v;
    $$('.mv-btn').forEach(x = x.classList.toggle('on', x === b));
  });
});

/* PREVIEW */
const iframe = $('#iframe');
const empty = $('#empty');

function findEntryName(){
  if (state.files['index.html']) return 'index.html';
  return Object.keys(state.files).find(k = /\.html?$/i.test(k)) || null;
}

function buildPreviewHTML(){
  const entry = findEntryName();
  if (!entry) return null;
  const entryFile = state.files[entry];
  if (!entryFile || !entryFile.content || !entryFile.content.trim()) return null;

  let html = entryFile.content;

  html = html.replace(/<link\b[^]*?/gi, tag = {
    if (!/rel\s*=\s*["']?stylesheet/i.test(tag)) return tag;
    const m = tag.match(/href\s*=\s*["']([^"']+)["']/i);
    if (!m) return tag;
    const path = m[1].replace(/^\.\//, '').replace(/^\//, '').split('?')[0].split('#')[0];
    if (state.files[path] && /\.css$/i.test(path)){
      return '<style\n' + state.files[path].content + '\n</style';
    }
    return tag;
  });

  html = html.replace(/<script\b([^]*)<\/script/gi, (full, attrs) = {
    const m = attrs.match(/src\s*=\s*["']([^"']+)["']/i);
    if (!m) return full;
    const path = m[1].replace(/^\.\//, '').replace(/^\//, '').split('?')[0].split('#')[0];
    if (state.files[path] && /\.(js|mjs)$/i.test(path)){
      const clean = attrs.replace(/\ssrc\s*=\s*["'][^"']+["']/i, '');
      return '<script' + clean + '\n' + state.files[path].content + '\n</script';
    }
    return full;
  });

  return html;
}

function renderPreview(){
  const html = buildPreviewHTML();
  if (!html){
    iframe.srcdoc = '';
    empty.classList.remove('off');
    return;
  }
  empty.classList.add('off');
  iframe.srcdoc = html;
}

/* FULLSCREEN */
$('#fsBtn').addEventListener('click', () = {
  const el = $('#frame');
  if (!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || (()={})).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || (()={})).call(document);
  }
});

/* TOOLS */
$('#addFileBtn').addEventListener('click', addFile);
$('#sampleBtn').addEventListener('click', () = {
  saveCurrentFile();
  state.files = JSON.parse(JSON.stringify(DEFAULT_FILES));
  state.active = 'index.html';
  renderTabs();
  loadActive();
  renderPreview();
  saveToStorage();
  toast('sample loaded');
});
$('#copyBtn').addEventListener('click', async () = {
  if (!code.value.trim()){ toast('nothing to copy', true); return; }
  try { await copyText(code.value); toast('copied'); }
  catch(e){ toast('copy failed', true); }
});
$('#downloadBtn').addEventListener('click', () = {
  if (!code.value.trim()){ toast('nothing to download', true); return; }
  const name = state.active || 'file.txt';
  const blob = new Blob([code.value], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() = URL.revokeObjectURL(url), 1500);
  toast('downloaded · ' + name);
});
$('#clearBtn').addEventListener('click', () = {
  if (!code.value.trim()) return;
  if (!confirm('Clear this file?')) return;
  code.value = '';
  saveCurrentFile();
  updateMeta();
  setStatus('saving');
  renderPreview();
  saveToStorage();
  setTimeout(() = setStatus('saved'), 300);
  toast('cleared');
});
$('#clearSaved').addEventListener('click', () = {
  if (!confirm('Clear all saved data?')) return;
  lsDel('v88.files');
  lsDel('v88.activeFile');
  lsDel('v88.viewport');
  state.files = JSON.parse(JSON.stringify(DEFAULT_FILES));
  state.active = 'index.html';
  renderTabs();
  loadActive();
  renderPreview();
  saveToStorage();
  closeDrawer();
  toast('data cleared');
});

/* KEYBOARD */
document.addEventListener('keydown', e = {
  if (e.key === 'Escape'){
    if (drawer.classList.contains('on')){ closeDrawer(); return; }
    if (document.fullscreenElement){
      (document.exitFullscreen || document.webkitExitFullscreen || (()={})).call(document);
      return;
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    e.preventDefault();
    saveCurrentFile();
    saveToStorage();
    setStatus('saved');
    toast('saved');
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n' && !e.shiftKey){
    e.preventDefault();
    addFile();
  }
});

document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
})();
</script
